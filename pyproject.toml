[project]
name = "nai-meta"
version = "0.1.0"
description = "读取、移除和改写 NovelAI 生成图片中的元数据（PNG 文本块、EXIF 与 LSB 隐写），不修改像素数据"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "numpy>=1.24",
    "prompt_toolkit>=3.0",
    "wcwidth>=0.2",
]

[project.scripts]
nai = "nai_meta.cli:main"                     # 子命令形式：nai i、nai s
naii = "nai_meta.nai_inspect:main"
nais = "nai_meta.nai_strip:main"
nai-inspect = "nai_meta.nai_inspect:main"
nai-strip = "nai_meta.nai_strip:main"

[project.urls]
Repository = "https://github.com/Miint-Sunny/nai-meta"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nai_meta"]
