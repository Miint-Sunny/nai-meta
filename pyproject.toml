[project]
name = "nai-meta"
version = "0.1.0"
description = "NovelAI 图片元数据小工具：读取 / 剥离 PNG 文本块与 LSB 隐写"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "numpy>=1.24",
    "prompt_toolkit>=3.0",
    "wcwidth>=0.2",
]

[project.scripts]
nai = "nai_meta.cli:main"                     # nai i / nai s
naii = "nai_meta.nai_inspect:main"
nais = "nai_meta.nai_strip:main"
nai-inspect = "nai_meta.nai_inspect:main"
nai-strip = "nai_meta.nai_strip:main"

[project.urls]
Repository = "https://github.com/Miint-Sunny/nai-meta"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nai_meta"]
